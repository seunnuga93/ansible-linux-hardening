---
- name: Restart sshd
  # Validate the merged config first so a typo can't lock everyone out.
  ansible.builtin.command: sshd -t
  changed_when: false
  notify: Restart sshd service

- name: Restart sshd service
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: linux_hardening_apply_sysctl | bool

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: linux_hardening_manage_auditd_service | bool

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
