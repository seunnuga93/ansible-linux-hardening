---
- name: Configure ufw (Debian family)
  when:
    - linux_hardening_manage_firewall | bool
    - ansible_os_family == "Debian"
  block:
    - name: Allow SSH and extra ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ [linux_hardening_ssh_port] + linux_hardening_firewall_allowed_tcp_ports }}"

    - name: Deny incoming by default and enable ufw
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

- name: Configure firewalld (RedHat family)
  when:
    - linux_hardening_manage_firewall | bool
    - ansible_os_family == "RedHat"
  block:
    - name: Start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Allow SSH and extra ports
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ [linux_hardening_ssh_port] + linux_hardening_firewall_allowed_tcp_ports }}"
